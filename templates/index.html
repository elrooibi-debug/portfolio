{% extends "base.html" %}

{% block index %}
    {% if not show_form %}
        <p>{{ presentation }}</p>

        {% if session.get('loggedin') %}
        <a href="{{ url_for('index', action='edit') }}">Edit</a>
        {% endif %}
        
    {% else %}
        <a href="{{ url_for('index') }}">Cancel</a>

        <form action="{{ url_for('index') }}" method="POST" style="margin-top: 10px;">
            <textarea name="Presentation" rows="6" cols="50" required>{{ presentation }}</textarea>
            <br>
            <input type="submit" value="Validate edition">
        </form>
    {% endif %}
{% endblock %}
